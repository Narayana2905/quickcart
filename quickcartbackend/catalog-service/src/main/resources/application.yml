spring:
  application:
    name: catalog-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/catalog_db}
    username: ${DB_USERNAME:catalog_svc}
    password: ${DB_PASSWORD}          # secret: intentionally no default (Section 15.2)
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8082}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
quickcart:
  jwt:
    secret: ${JWT_SECRET}          # secret: no default, min 32 chars
    issuer: quickcart-user-service
  internal:
    api-key: ${INTERNAL_API_KEY}     # secret: no default
springdoc:
  swagger-ui:
    path: /swagger-ui.html