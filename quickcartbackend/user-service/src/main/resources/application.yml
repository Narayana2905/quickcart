spring:
  application:
    name: user-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  autoconfigure:
    exclude:
      # we authenticate with JWT (step 4); this stops Spring printing a random dev password
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/user_db}
    username: ${DB_USERNAME:user_svc}
    password: ${DB_PASSWORD}          # secret: intentionally no default (Section 15.2)
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8081}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info          # Section 15.2

springdoc:
  swagger-ui:
    path: /swagger-ui.html
quickcart:
  jwt:
    secret: ${JWT_SECRET}                 # secret: no default (Section 15.2), min 32 chars
    expiry-seconds: ${JWT_EXPIRY_SECONDS:3600}
    issuer: quickcart-user-service
  admin:
    email: ${ADMIN_EMAIL:admin@quickcart.local}
    password: ${ADMIN_PASSWORD}           # secret: no default