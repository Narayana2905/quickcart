spring:
  application:
    name: api-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    serialization:
      write-dates-as-timestamps: false
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false          # CRITICAL: no auto-routes, otherwise /internal/** would be exposed
      globalcors:
        add-to-simple-url-handler-mapping: true   # preflight also works for unmatched paths
        cors-configurations:
          '[/**]':
            allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
            allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            allowedHeaders: [Authorization, Content-Type]
            maxAge: 3600
      # Section 15.2 route table (final). Anything else, including /internal/**, has no route = 404.
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/auth/**,/api/v1/users/**
        - id: catalog-service
          uri: lb://catalog-service
          predicates:
            - Path=/api/v1/categories/**,/api/v1/products/**,/api/v1/admin/categories/**,/api/v1/admin/products/**,/api/v1/admin/inventory/**
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/v1/cart/**,/api/v1/orders/**,/api/v1/admin/orders/**

server:
  port: ${SERVER_PORT:8080}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info        # Section 15.2
quickcart:
  jwt:
    secret: ${JWT_SECRET}
    issuer: quickcart-user-service