spring:
  application:
    name: order-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/order_db}
    username: ${DB_USERNAME:order_svc}
    password: ${DB_PASSWORD}          # secret: intentionally no default (Section 15.2)
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8083}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html  

# Section 15.1 business constants (non-secret defaults). Read by the cart/order units.
quickcart:
  order:
    delivery-fee: ${DELIVERY_FEE:25.00}
    free-delivery-threshold: ${FREE_DELIVERY_THRESHOLD:200.00}
    max-cart-line-quantity: ${MAX_CART_LINE_QUANTITY:20}
  catalog-client:
    connect-timeout-ms: ${CATALOG_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${CATALOG_READ_TIMEOUT_MS:5000}
  jwt:
    secret: ${JWT_SECRET}          # secret: no default, min 32 chars
    issuer: quickcart-user-service
  internal:
    api-key: ${INTERNAL_API_KEY}     # secret: no default