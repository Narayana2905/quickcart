server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Docker's built-in DNS. Re-resolving means a restarted api-gateway is found again.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Decision D14: one origin for the browser, so no CORS in Docker or on AWS.
    location /api/ {
        set $gateway http://api-gateway:8080;
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;   # keeps the port, so Origin == Host (see note below)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;             # above our 15 s Axios timeout, so the browser gives up first
    }

    # Vite fingerprints these file names, so they can be cached for a year
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # The entry file must always be re-checked, or users keep an old app
    location = /index.html {
        expires -1;
    }

    # SPA fallback: /orders/42 on refresh must serve the app, not a 404
    location / {
        try_files $uri /index.html;
    }
}